name: CI

# One run per PR update (pull_request) plus one on main after a merge; a branch push alone no longer
# runs a duplicate. Docs-only changes skip CI, except docs a test reads (re-included after the "!" lines;
# enforced by tests/build-skip-contract.test.ts). Keep both lists identical. Andrew, 2026-11-24.
on:
  push:
    branches:
      - main
    paths:
      - "**"
      - "!docs/**"
      - "!*.md"
      - "docs/native-app-store-plan.md"
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "!*.md"
      - "docs/native-app-store-plan.md"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        # Node's default ~2 GB heap runs out during the build's TypeScript step on the runner.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build
