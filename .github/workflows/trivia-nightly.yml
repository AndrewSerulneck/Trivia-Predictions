name: Trivia Nightly
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  schedule:
    # 02:15 UTC nightly (~10:15 PM ET during DST / 9:15 PM ET during EST)
    - cron: "15 2 * * *"
  workflow_dispatch:

concurrency:
  group: trivia-nightly-main
  cancel-in-progress: false

jobs:
  generate-and-import:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      # Phase 4 must configure an approved cap + signing secret after schema review.
      # One coordinator generates, checks and admits; no unchecked import fallback.
      - name: Generate and admit checked Speed Trivia
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-2.5-flash' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SPEED_TRIVIA_ADMISSION_SECRET: ${{ secrets.SPEED_TRIVIA_ADMISSION_SECRET }}
          SPEED_TRIVIA_MAX_DOLLARS: ${{ vars.SPEED_TRIVIA_MAX_DOLLARS }}
        run: |
          node scripts/generate-trivia-nightly.cjs \
            --new-only-dir "$RUNNER_TEMP/speed-trivia-report" \
            --total 100 --batch-size 10 --new-categories 0 --allow-category-errors

      - name: Preserve internal run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speed-trivia-admission-report
          path: ${{ runner.temp }}/speed-trivia-report/
          retention-days: 7
          if-no-files-found: ignore
