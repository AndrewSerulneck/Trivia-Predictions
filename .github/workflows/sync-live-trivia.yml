name: Sync Live Trivia

on:
  workflow_dispatch:
  # Monthly (D16): entries past their expires_on are treated as absent and pruned from the database without a push.
  # Expiry dates are always the 1st of a month, so a run early on the 1st (UTC) catches each month's expiries.
  schedule:
    - cron: "20 6 1 * *"
  push:
    branches:
      - main
    paths:
      - "data/live-trivia/categories/**"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Validate live trivia JSON
        run: npm run live-trivia:check

      - name: Import, prune, and verify live trivia questions
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # Plain node: the npm script loads .env.local, which CI doesn't have (the import failed this way since 2026-06).
        run: node scripts/import-trivia-questions.cjs --live-dir data/live-trivia/categories
