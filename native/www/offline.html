<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>No connection</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
         justify-content: center; gap: 16px; padding: 16px; box-sizing: border-box; text-align: center;
         background: #0f172a; color: #f8fafc; font: 16px/1.4 -apple-system, system-ui, sans-serif; }
  button { font: inherit; padding: 12px 24px; border-radius: 999px; border: 0;
           background: #f8fafc; color: #0f172a; font-weight: 700; }
</style>
</head>
<body>
<h1 style="font-size: 22px; margin: 0;">No connection</h1>
<p style="margin: 0;">Hightop Challenge needs the internet. Check your connection and try again.</p>
<button type="button" id="retry">Try again</button>
<script>
  // The shell opens this page as offline.html?url=<the page that failed>
  // (docs/native-app-store-plan.md Phase 2E). "Try again" reloads THAT page —
  // but only if it is one of our own https pages; anything else, or no url,
  // goes to the start page. Never navigate to an arbitrary address.
  var START_URL = "https://play.hightopchallenge.com/";
  var OUR_HOSTS = ["play.hightopchallenge.com", "hightopchallenge.com"];
  function retryTarget() {
    try {
      var raw = new URLSearchParams(window.location.search).get("url");
      if (!raw) return START_URL;
      var url = new URL(raw);
      if (url.protocol === "https:" && OUR_HOSTS.indexOf(url.hostname) !== -1) return url.href;
    } catch (e) {}
    return START_URL;
  }
  document.getElementById("retry").addEventListener("click", function () {
    window.location.replace(retryTarget());
  });
</script>
</body>
</html>
