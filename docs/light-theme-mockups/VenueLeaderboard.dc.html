<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Venue Home Leaderboard, light</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bree+Serif&amp;family=Nunito:wght@400;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F5FA; font-family: Nunito, system-ui, sans-serif; color: #0F172A; overflow: hidden">

  <header style="background: rgba(255,255,255,0.94); border-bottom: 1px solid rgba(15,23,42,0.08); padding: 10px 16px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <button type="button" aria-label="Open navigation menu" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid rgba(15,23,42,0.12); background: #FFFFFF; color: #0F172A; display: flex; align-items: center; justify-content: center; padding: 0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"></path></svg>
      </button>
      <h2 style="margin: 0; font-family: 'Bree Serif', serif; font-weight: 400; font-size: 18px; letter-spacing: 0.04em; text-transform: uppercase; color: #0E7490">Pacific Street</h2>
      <button type="button" aria-label="Notifications" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid rgba(15,23,42,0.12); background: #FFFFFF; color: #0F172A; display: flex; align-items: center; justify-content: center; padding: 0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
      </button>
    </div>
    <div style="background: #E8EDF4; border-radius: 999px; padding: 4px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
      <button type="button" style="border: 0; border-radius: 999px; padding: 9px 4px; background: transparent; color: #334155; font-family: inherit; font-size: 12px; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase">Games</button>
      <button type="button" style="border: 0; border-radius: 999px; padding: 9px 4px; background: #0E7490; color: #FFFFFF; font-family: inherit; font-size: 12px; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase">Leaderboard</button>
      <button type="button" style="border: 0; border-radius: 999px; padding: 9px 4px; background: transparent; color: #334155; font-family: inherit; font-size: 12px; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase">Prizes</button>
    </div>
  </header>

  <main style="padding: 6px 16px 24px">
    <section style="background: #FFFFFF; border: 1px solid rgba(15,23,42,0.08); border-radius: 16px; padding: 16px; box-shadow: 0 1px 2px rgba(15,23,42,0.05), 0 6px 16px rgba(15,23,42,0.06); display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap">
        <p style="margin: 0; font-size: 14px; font-weight: 900; letter-spacing: 0.14em; text-transform: uppercase; color: #0E7490">Leaderboard</p>
        <div style="display: flex; gap: 8px">
          <button type="button" style="height: 40px; border-radius: 999px; border: 1px solid rgba(14,116,144,0.30); background: #F3F5FA; color: #0F172A; font-family: inherit; font-size: 14px; font-weight: 900; padding: 0 14px; display: flex; align-items: center; gap: 6px">All Games <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0E7490" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
          <button type="button" style="height: 40px; border-radius: 999px; border: 1px solid rgba(14,116,144,0.30); background: #F3F5FA; color: #0F172A; font-family: inherit; font-size: 14px; font-weight: 900; padding: 0 14px; display: flex; align-items: center; gap: 6px">This Week <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0E7490" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
        </div>
      </div>

      <div style="border: 1px solid rgba(15,23,42,0.10); border-radius: 14px; overflow: hidden">
        <div style="display: grid; grid-template-columns: 64px 1fr 80px; background: #F3F5FA; border-bottom: 1px solid rgba(15,23,42,0.10); padding: 9px 12px; font-size: 13px; font-weight: 900; letter-spacing: 0.12em; text-transform: uppercase; color: #B45309">
          <span>Rank</span><span>Username</span><span style="text-align: right">Points</span>
        </div>
        <sc-for list="{{rows}}" as="row" hint-placeholder-count="10">
          <div style="display: grid; grid-template-columns: 64px 1fr 80px; align-items: center; padding: 10px 12px; border-top: 1px solid rgba(15,23,42,0.06); background: {{row.bg}}">
            <span style="display: inline-flex; justify-content: center; min-width: 38px; width: 38px; border-radius: 999px; border: 1px solid {{row.rankBorder}}; background: {{row.rankBg}}; color: {{row.rankText}}; font-size: 14px; font-weight: 800; padding: 2px 0; font-variant-numeric: tabular-nums">{{row.rank}}</span>
            <span style="font-size: 16px; font-weight: 700; color: #0F172A; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{row.name}}</span>
            <span style="text-align: right; font-size: 16px; font-weight: 800; color: #0F172A; font-variant-numeric: tabular-nums">{{row.points}}</span>
          </div>
        </sc-for>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const medal = [
      { rankBg: "#FEF3C7", rankBorder: "rgba(180,83,9,0.35)", rankText: "#92400E" },
      { rankBg: "#F1F5F9", rankBorder: "rgba(71,85,105,0.30)", rankText: "#334155" },
      { rankBg: "#FFEDD5", rankBorder: "rgba(154,52,18,0.30)", rankText: "#9A3412" }
    ];
    const plain = { rankBg: "#FFFFFF", rankBorder: "rgba(15,23,42,0.12)", rankText: "#5B6B82" };
    const names = ["TriviaTitan", "HoopsHank", "QuizQueen22", "BarStoolBen", "LuckyLefty", "You", "PintSizedPat", "GridironGabe", "MapleMaven", "NightOwlNia"];
    const pts = [1840, 1625, 1410, 1290, 1175, 1060, 940, 870, 805, 760];
    return {
      rows: names.map((name, i) => Object.assign({
        rank: String(i + 1),
        name: name,
        points: pts[i].toLocaleString(),
        bg: name === "You" ? "#ECFEFF" : "#FFFFFF"
      }, i < 3 ? medal[i] : plain))
    };
  }
}
</script>
</body>
</html>
