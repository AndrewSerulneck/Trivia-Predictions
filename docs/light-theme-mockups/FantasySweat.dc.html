<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fantasy My Sweat, light</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bree+Serif&amp;family=Nunito:wght@400;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 1360px; box-sizing: border-box; background: #F3F5FA; font-family: Nunito, system-ui, sans-serif; color: #0F172A; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; background: rgba(255,255,255,0.94); border-bottom: 1px solid rgba(15,23,42,0.08); padding: 10px 13px 8px">
    <button type="button" aria-label="Back to venue" style="width: 34px; height: 34px; border-radius: 999px; border: 1px solid rgba(15,23,42,0.12); background: #FFFFFF; color: #334155; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
    </button>
    <div style="display: flex; align-items: center; gap: 8px; min-width: 0">
      <img src="/_blob/b3dd928e56adfe750d01a774fc14e829" alt="" style="width: 26px; height: 26px; border-radius: 7px; background: #7c3aed; object-fit: contain">
      <span style="font-size: 14px; font-weight: 900; letter-spacing: 0.11em; text-transform: uppercase; color: #0F5C4A">Fantasy</span>
    </div>
    <div style="display: flex; align-items: center; gap: 6px">
      <span style="display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; border: 1px solid rgba(180,83,9,0.30); background: #FFFBEB; color: #92400E; font-size: 13px; font-weight: 900; padding: 5px 10px; font-variant-numeric: tabular-nums"><span style="width: 10px; height: 10px; border-radius: 999px; background: #F59E0B"></span>1,060</span>
      <button type="button" aria-label="Notifications" style="width: 34px; height: 34px; border-radius: 999px; border: 1px solid rgba(15,23,42,0.12); background: #FFFFFF; color: #334155; display: flex; align-items: center; justify-content: center; padding: 0">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
      </button>
    </div>
  </div>

  <main style="padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 12px">

    <section style="background: #FFFFFF; border: 1px solid rgba(15,23,42,0.08); border-radius: 12px; overflow: hidden">
      <div style="display: flex; align-items: center; gap: 8px; padding: 6px 8px">
        <div style="flex: 1; display: flex; gap: 6px">
          <button type="button" style="border-radius: 999px; border: 1px solid #0F5C4A; background: #0F5C4A; color: #FFFFFF; font-family: inherit; font-size: 12px; font-weight: 900; padding: 6px 12px">NBA</button>
          <button type="button" style="display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; border: 1px solid rgba(15,92,74,0.30); background: #FFFFFF; color: #0F5C4A; font-family: inherit; font-size: 12px; font-weight: 900; padding: 6px 12px"><span style="width: 6px; height: 6px; border-radius: 999px; background: #CA8A04"></span>MLB</button>
          <button type="button" disabled style="display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; border: 1px solid rgba(15,23,42,0.12); background: #FFFFFF; color: #8492A6; font-family: inherit; font-size: 12px; font-weight: 900; padding: 6px 12px">NFL <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase">Soon</span></button>
        </div>
        <span style="font-size: 12px; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; color: #5B6B82">2 entries</span>
      </div>
      <div style="height: 1px; background: rgba(15,23,42,0.07)"></div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 6px 8px">
        <button type="button" aria-label="Previous day" style="width: 30px; height: 30px; border-radius: 8px; border: 1px solid rgba(15,92,74,0.30); background: #F2F8F5; color: #0F5C4A; font-size: 12px; padding: 0">◀</button>
        <div style="flex: 1; text-align: center; font-size: 25px; font-weight: 900; color: #0F172A">Today</div>
        <button type="button" aria-label="Next day" disabled style="width: 30px; height: 30px; border-radius: 8px; border: 1px solid rgba(15,92,74,0.20); background: #F2F8F5; color: #0F5C4A; font-size: 12px; padding: 0; opacity: 0.4">▶</button>
        <span style="font-size: 12px; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; color: #0F5C4A">Locks at tip</span>
      </div>
    </section>

    <div style="background: #E8EDF4; border-radius: 12px; padding: 4px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px">
      <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 9px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(15,23,42,0.12); color: #0F5C4A; font-family: inherit; font-size: 13px; font-weight: 900; padding: 9px"><span style="width: 7px; height: 7px; border-radius: 999px; background: #10B981"></span>My Sweat</button>
      <button type="button" style="border: 0; border-radius: 9px; background: transparent; color: #334155; font-family: inherit; font-size: 13px; font-weight: 900; padding: 9px">Leaderboard · 14</button>
    </div>

    <section style="position: relative; overflow: hidden; border-radius: 18px; border: {{sb.border}}; background: {{sb.bg}}; padding: 14px 14px 16px; box-shadow: {{sb.shadow}}">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <p style="margin: 0; font-size: 12px; font-weight: 900; letter-spacing: 0.16em; text-transform: uppercase; color: {{sb.label}}">Live Game</p>
        <span style="display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; border: 1px solid {{sb.pillBorder}}; background: {{sb.pillBg}}; color: {{sb.pillText}}; font-size: 12px; font-weight: 900; letter-spacing: 0.16em; text-transform: uppercase; padding: 4px 8px"><span style="width: 6px; height: 6px; border-radius: 999px; background: #10B981"></span>Live</span>
      </div>
      <div style="margin-top: 6px; display: flex; align-items: flex-end; gap: 10px">
        <span style="font-family: ui-monospace, Menlo, monospace; font-size: 46px; font-weight: 900; line-height: 0.95; color: {{sb.total}}; font-variant-numeric: tabular-nums">142.5</span>
        <span style="padding-bottom: 6px; font-size: 12px; font-weight: 800; line-height: 1.2; letter-spacing: 0.08em; text-transform: uppercase; color: {{sb.sub}}">fantasy<br>points</span>
      </div>
      <div style="margin-top: 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{stats}}" as="st" hint-placeholder-count="3">
          <div style="border-radius: 10px; border: 1px solid {{sb.boxBorder}}; background: {{sb.boxBg}}; padding: 6px 8px">
            <div style="font-size: 12px; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; color: {{sb.sub}}">{{st.l}}</div>
            <div style="margin-top: 2px; font-family: ui-monospace, Menlo, monospace; font-size: 15px; font-weight: 900; color: {{st.c}}; font-variant-numeric: tabular-nums">{{st.v}}</div>
            <div style="font-size: 12px; font-weight: 700; color: {{sb.sub}}">{{st.sub}}</div>
          </div>
        </sc-for>
      </div>
    </section>

    <div style="display: flex; align-items: center; gap: 8px; border-radius: 10px; border: 1px solid rgba(37,99,235,0.22); background: #EFF6FF; padding: 8px 12px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1D4ED8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
      <span style="font-size: 12px; font-weight: 700; line-height: 1.4; color: #1E40AF">At the venue — live scoring active. Leave and scoring pauses.</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <p style="margin: 0 0 2px; font-size: 12px; font-weight: 900; letter-spacing: 0.16em; text-transform: uppercase; color: #0F5C4A">Your roster · locked</p>
      <sc-for list="{{roster}}" as="p" hint-placeholder-count="5">
        <div style="display: grid; grid-template-columns: 60px 1fr auto; align-items: center; gap: 14px; border-radius: 18px; border: 1px solid rgba(15,23,42,0.08); background: #FFFFFF; padding: 16px; box-shadow: 0 1px 2px rgba(15,23,42,0.05)">
          <div style="width: 60px; height: 60px; border-radius: 999px; background: #F2F8F5; border: 2px solid {{p.ring}}; display: flex; align-items: center; justify-content: center; box-sizing: border-box; font-size: 17px; font-weight: 900; color: #0F5C4A">{{p.initials}}</div>
          <div style="min-width: 0">
            <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px">
              <span style="font-size: 15px; font-weight: 900; color: #0F172A">{{p.name}}</span>
              <span style="display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; background: {{p.pillBg}}; color: {{p.pillText}}; font-size: 12px; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 7px">{{p.state}}</span>
            </div>
            <div style="margin-top: 4px; font-size: 12px; font-weight: 700; color: #5B6B82"><span style="color: #0F5C4A">{{p.pos}}</span> · {{p.team}}</div>
          </div>
          <div style="text-align: right">
            <div style="font-size: 12px; font-weight: 900; letter-spacing: 0.14em; text-transform: uppercase; color: #5B6B82">FP</div>
            <div style="font-family: ui-monospace, Menlo, monospace; font-size: 24px; font-weight: 900; line-height: 1.05; color: #A16207; font-variant-numeric: tabular-nums">{{p.fp}}</div>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; align-items: center; gap: 6px">
      <span style="width: 6px; height: 6px; border-radius: 999px; background: #10B981"></span>
      <p style="margin: 0; font-size: 12px; font-weight: 600; color: #047857">Live · Streaming updates</p>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"scoreboard":{"editor":"enum","options":["chalkboard","light"],"default":"chalkboard"},"$preview":{"width":390,"height":1360}}'>
class Component extends DCLogic {
  renderVals() {
    const chalk = (this.props.scoreboard ?? 'chalkboard') === 'chalkboard';
    const sb = chalk ? {
      bg: "#0a3128", border: "2px solid rgba(254,243,199,0.55)", shadow: "0 10px 24px rgba(10,49,40,0.25)",
      label: "#fde68a", total: "#6ee7b7", sub: "rgba(254,243,199,0.70)",
      pillBorder: "rgba(110,231,183,0.45)", pillBg: "rgba(16,185,129,0.15)", pillText: "#6ee7b7",
      boxBorder: "rgba(254,243,199,0.18)", boxBg: "rgba(0,0,0,0.30)",
      c1: "#6ee7b7", c2: "#fde68a", c3: "#67e8f9"
    } : {
      bg: "#FFFFFF", border: "1px solid rgba(15,92,74,0.25)", shadow: "0 1px 2px rgba(15,23,42,0.05), 0 6px 16px rgba(15,23,42,0.06)",
      label: "#0F5C4A", total: "#047857", sub: "#5B6B82",
      pillBorder: "rgba(4,120,87,0.30)", pillBg: "#ECFDF5", pillText: "#047857",
      boxBorder: "rgba(15,92,74,0.12)", boxBg: "#F2F8F5",
      c1: "#047857", c2: "#A16207", c3: "#0E7490"
    };
    const roster = [
      { name: "Nikola Jokić", initials: "NJ", pos: "C", team: "DEN", fp: "48.5", live: true },
      { name: "Shai Gilgeous-Alexander", initials: "SG", pos: "PG", team: "OKC", fp: "39.0", live: true },
      { name: "Anthony Edwards", initials: "AE", pos: "SG", team: "MIN", fp: "31.5", live: true },
      { name: "Victor Wembanyama", initials: "VW", pos: "C", team: "SAS", fp: "23.5", live: true },
      { name: "Jalen Brunson", initials: "JB", pos: "PG", team: "NYK", fp: "0.0", live: false }
    ].map((p) => Object.assign({}, p, {
      state: p.live ? "Live" : "Pending",
      pillBg: p.live ? "#ECFDF5" : "#F1F5F9",
      pillText: p.live ? "#047857" : "#5B6B82",
      ring: p.live ? "#10B981" : "rgba(15,23,42,0.10)"
    }));
    return {
      sb: sb,
      stats: [
        { l: "Venue rank", v: "2nd", sub: "of 14", c: sb.c1 },
        { l: "Venue avg", v: "118.2", sub: "+24.3", c: sb.c2 },
        { l: "Players live", v: "4/5", sub: "scoring", c: sb.c3 }
      ],
      roster: roster
    };
  }
}
</script>
</body>
</html>
