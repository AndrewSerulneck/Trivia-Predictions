<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Venue Home Games, light</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bree+Serif&amp;family=Nunito:wght@400;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 1700px; box-sizing: border-box; background: #F3F5FA; font-family: Nunito, system-ui, sans-serif; color: #0F172A; overflow: hidden">

  <header style="background: rgba(255,255,255,0.94); border-bottom: 1px solid rgba(15,23,42,0.08); padding: 10px 16px 10px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <button type="button" aria-label="Open navigation menu" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid rgba(15,23,42,0.12); background: #FFFFFF; color: #0F172A; display: flex; align-items: center; justify-content: center; padding: 0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"></path></svg>
      </button>
      <h2 style="margin: 0; font-family: 'Bree Serif', serif; font-weight: 400; font-size: 18px; letter-spacing: 0.04em; text-transform: uppercase; color: #0E7490">Pacific Street</h2>
      <button type="button" aria-label="Notifications" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid rgba(15,23,42,0.12); background: #FFFFFF; color: #0F172A; display: flex; align-items: center; justify-content: center; padding: 0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
      </button>
    </div>
    <div style="background: #E8EDF4; border-radius: 999px; padding: 4px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
      <button type="button" style="border: 0; border-radius: 999px; padding: 9px 4px; background: #0E7490; color: #FFFFFF; font-family: inherit; font-size: 12px; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase">Games</button>
      <button type="button" style="border: 0; border-radius: 999px; padding: 9px 4px; background: transparent; color: #334155; font-family: inherit; font-size: 12px; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase">Leaderboard</button>
      <button type="button" style="position: relative; border: 0; border-radius: 999px; padding: 9px 4px; background: transparent; color: #334155; font-family: inherit; font-size: 12px; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase">Prizes<span style="position: absolute; right: -2px; top: -4px; min-width: 18px; height: 18px; border-radius: 999px; background: #E11D48; color: #FFFFFF; font-size: 12px; line-height: 18px; text-align: center; padding: 0 4px; box-sizing: border-box">1</span></button>
    </div>
  </header>

  <main style="padding: 10px 16px 24px; display: flex; flex-direction: column; gap: 12px">

    <section style="background: #FFFFFF; border: 1px solid rgba(217,119,6,0.45); border-radius: 16px; padding: 12px; box-shadow: 0 1px 2px rgba(15,23,42,0.05), 0 6px 16px rgba(15,23,42,0.06); display: flex; align-items: stretch; gap: 12px">
      <div style="flex: 1; min-width: 0">
        <p style="margin: 0; font-size: 12px; font-weight: 900; letter-spacing: 0.14em; text-transform: uppercase; color: #B45309">Next Live Trivia Showdown In</p>
        <p style="margin: 4px 0 0; font-size: 35px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; color: #92400E">12:45</p>
      </div>
      <button type="button" style="min-width: 115px; border-radius: 12px; border: 1px solid rgba(14,116,144,0.35); background: #ECFEFF; color: #0E7490; font-family: inherit; font-size: 18px; font-weight: 900; line-height: 1.15; padding: 8px 16px">Enter<br>lobby</button>
    </section>

    <sc-for list="{{tiles}}" as="tile" hint-placeholder-count="7">
      <button type="button" style="position: relative; display: block; width: 100%; min-height: 190px; border: 0; border-radius: 22px; padding: 16px; text-align: left; overflow: hidden; background: {{tile.color}}; box-shadow: 0 10px 24px rgba(15,23,42,0.16); font-family: inherit; box-sizing: border-box">
        <img src="{{tile.icon}}" alt="" style="position: absolute; right: 8px; top: 8px; width: 88px; height: 88px; object-fit: contain; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.35))">
        <div style="font-family: 'Bree Serif', serif; font-size: 32px; line-height: 0.95; letter-spacing: 0.045em; text-transform: uppercase; color: #FFFFFF; text-shadow: 0 1px 0 rgba(12,18,28,.8), 0 3px 0 rgba(12,18,28,.58); padding-right: 96px; white-space: pre-line">{{tile.title}}</div>
        <div style="margin-top: 12px; font-size: 19px; font-weight: 700; line-height: 1.35; color: rgba(255,255,255,0.95); padding-right: 40px">{{tile.subtitle}}</div>
      </button>
    </sc-for>

  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1700}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      tiles: [
        { title: "Category Blitz", subtitle: "Our twist on a classic word game.", color: "#701a75", icon: "/_blob/1a8f773433039e08eba8279134d99fb5" },
        { title: "Speed Trivia", subtitle: "Rapid fire, multiple choice. Play anytime.", color: "#d97706", icon: "/_blob/411b132f48ab199a9de081ae1948cb41" },
        { title: "NFL\nPick 'Em", subtitle: "Pick the most winners each week.", color: "#1a2f72", icon: "/_blob/57cb1a58cbeaa1aa948f65b2770c3ae0" },
        { title: "Live Trivia", subtitle: "Classic bar trivia the whole room plays together.", color: "#0891b2", icon: "/_blob/9a861c8db69ee21f06828f31484f3a40" },
        { title: "Prop Bingo", subtitle: "Track your squares as you watch today's games on TV.", color: "#059669", icon: "/_blob/b8ae8c44e43b2df4f965d6cf70604826" },
        { title: "Fantasy Sports", subtitle: "Draft the ultimate roster. The better they perform, the more points you earn.", color: "#7c3aed", icon: "/_blob/b3dd928e56adfe750d01a774fc14e829" },
        { title: "Pick 'Em", subtitle: "Predict the winners of today's matchups across every major sport.", color: "#4f46e5", icon: "/_blob/a9d9b4953ab9978811c157c94995265a" }
      ]
    };
  }
}
</script>
</body>
</html>
