<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pick 'Em, light</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bree+Serif&amp;family=Nunito:wght@400;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 1560px; box-sizing: border-box; background: #F3F5FA; font-family: Nunito, system-ui, sans-serif; color: #0F172A; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; background: rgba(255,255,255,0.94); border-bottom: 1px solid rgba(15,23,42,0.08); padding: 10px 13px 8px">
    <button type="button" aria-label="Back to venue" style="width: 34px; height: 34px; border-radius: 999px; border: 1px solid rgba(15,23,42,0.12); background: #FFFFFF; color: #334155; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
    </button>
    <div style="display: flex; align-items: center; gap: 8px; min-width: 0">
      <img src="/_blob/a9d9b4953ab9978811c157c94995265a" alt="" style="width: 26px; height: 26px; border-radius: 7px; background: #4f46e5; object-fit: contain">
      <span style="font-size: 14px; font-weight: 900; letter-spacing: 0.11em; text-transform: uppercase; color: #1A2F72">Pick 'Em</span>
    </div>
    <div style="display: flex; align-items: center; gap: 6px">
      <span style="display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; border: 1px solid rgba(180,83,9,0.30); background: #FFFBEB; color: #92400E; font-size: 13px; font-weight: 900; padding: 5px 10px; font-variant-numeric: tabular-nums"><span style="width: 10px; height: 10px; border-radius: 999px; background: #F59E0B"></span>1,060</span>
      <button type="button" aria-label="Notifications" style="width: 34px; height: 34px; border-radius: 999px; border: 1px solid rgba(15,23,42,0.12); background: #FFFFFF; color: #334155; display: flex; align-items: center; justify-content: center; padding: 0">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
      </button>
    </div>
  </div>

  <main style="padding: 8px 8px 24px; display: flex; flex-direction: column; gap: 12px">
    <section style="background: #FFFFFF; border: 1px solid rgba(15,23,42,0.08); border-radius: 16px; padding: 12px; box-shadow: 0 1px 2px rgba(15,23,42,0.05), 0 6px 16px rgba(15,23,42,0.06); display: flex; flex-direction: column; gap: 12px">
      <div>
        <h2 style="margin: 0; font-family: 'Bree Serif', serif; font-weight: 400; font-size: 20px; line-height: 1; color: #1A2F72">Hightop Pick 'Em</h2>
        <p style="margin: 8px 0 0; font-size: 13px; font-weight: 600; line-height: 1.6; color: #5B6B82">Select winners by checking a team. Picks lock at scheduled start time and are final.</p>
      </div>

      <div style="border: 1px solid rgba(26,47,114,0.16); border-radius: 12px; overflow: hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; background: #F5F7FD; border-bottom: 1px solid rgba(26,47,114,0.10); padding: 6px 12px">
          <span style="font-size: 12px; font-weight: 900; letter-spacing: 0.16em; text-transform: uppercase; color: #5B6B82">Pick Tracker</span>
          <span style="font-size: 12px; font-weight: 900; letter-spacing: 0.16em; text-transform: uppercase; color: #1A2F72">Daily Picks</span>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px">
          <div style="flex: 1; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px">
            <sc-for list="{{segments}}" as="seg" hint-placeholder-count="10">
              <div style="height: 7px; border-radius: 999px; background: {{seg.color}}"></div>
            </sc-for>
          </div>
          <span style="font-size: 19px; font-weight: 900; line-height: 1; color: #1A2F72; font-variant-numeric: tabular-nums">3<span style="font-size: 12px; font-weight: 600; color: #5B6B82">/10</span></span>
        </div>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; border-radius: 12px; border: 1px solid rgba(26,47,114,0.16); background: #F5F7FD; padding: 6px 8px">
        <button type="button" aria-label="Previous day" style="width: 32px; height: 32px; border-radius: 999px; border: 1px solid rgba(26,47,114,0.25); background: #FFFFFF; color: #1A2F72; font-size: 12px; padding: 0">◀</button>
        <span style="font-size: 13px; font-weight: 800; color: #0F172A">Thu · Oct 22 (Today)</span>
        <button type="button" aria-label="Next day" disabled style="width: 32px; height: 32px; border-radius: 999px; border: 1px solid rgba(26,47,114,0.15); background: #FFFFFF; color: #1A2F72; font-size: 12px; padding: 0; opacity: 0.35">▶</button>
      </div>

      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{sports}}" as="sport" hint-placeholder-count="6">
          <button type="button" aria-label="{{sport.label}}" style="height: 48px; border-radius: 999px; border: 1px solid {{sport.border}}; background: {{sport.bg}}; font-size: 24px; line-height: 1; padding: 0; opacity: {{sport.opacity}}">{{sport.icon}}</button>
        </sc-for>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: flex-end; padding: 0 2px">
        <h3 style="margin: 0; font-size: 12px; font-weight: 900; letter-spacing: 0.16em; text-transform: uppercase; color: #1A2F72">NBA</h3>
        <span style="font-size: 12px; font-weight: 700; color: #5B6B82">5 games</span>
      </div>

      <sc-for list="{{games}}" as="g" hint-placeholder-count="5">
        <div style="border-radius: 12px; overflow: hidden; border: 1px solid {{g.s.cardBorder}}; background: {{g.s.cardBg}}; box-shadow: {{g.s.shadow}}">
          <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; border-bottom: 1px {{g.s.ruleStyle}} {{g.s.rule}}">
            <span style="font-size: 12px; font-weight: 900; letter-spacing: 0.16em; text-transform: uppercase; color: {{g.s.label}}">NBA</span>
            <span style="display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 800; color: {{g.statusColor}}"><span style="width: 8px; height: 8px; border-radius: 999px; background: {{g.liveDot}}; display: {{g.liveDisplay}}"></span>{{g.status}}</span>
          </div>
          <div style="display: flex; background: {{g.s.halvesBg}}">
            <button type="button" style="width: 50%; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 16px 8px; border: 0; background: {{g.awayBg}}; font-family: inherit">
              <span style="width: 28px; height: 28px; box-sizing: border-box; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 900; border: 1px solid {{g.awayBox.border}}; background: {{g.awayBox.bg}}; color: {{g.awayBox.text}}; transform: {{g.awayBox.rotate}}">✓</span>
              <span style="font-size: 15px; font-weight: 900; line-height: 1.2; color: {{g.s.team}}">{{g.away}}</span>
              <span style="font-size: 16px; font-weight: 900; color: {{g.awayScoreColor}}; font-variant-numeric: tabular-nums">{{g.awayScore}}</span>
            </button>
            <div style="width: 1px; background: {{g.s.divider}}"></div>
            <button type="button" style="width: 50%; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 16px 8px; border: 0; background: {{g.homeBg}}; font-family: inherit">
              <span style="width: 28px; height: 28px; box-sizing: border-box; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 900; border: 1px solid {{g.homeBox.border}}; background: {{g.homeBox.bg}}; color: {{g.homeBox.text}}; transform: {{g.homeBox.rotate}}">✓</span>
              <span style="font-size: 15px; font-weight: 900; line-height: 1.2; color: {{g.s.team}}">{{g.home}}</span>
              <span style="font-size: 16px; font-weight: 900; color: {{g.homeScoreColor}}; font-variant-numeric: tabular-nums">{{g.homeScore}}</span>
            </button>
          </div>
          <sc-if value="{{g.hasResult}}" hint-placeholder-val="{{false}}">
            <div style="padding: 6px 16px; font-size: 12px; font-weight: 800; letter-spacing: 0.04em; background: {{g.resultBg}}; color: {{g.resultText}}">{{g.result}}</div>
          </sc-if>
        </div>
      </sc-for>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ticket":{"editor":"enum","options":["light","classic"],"default":"light"},"$preview":{"width":390,"height":1560}}'>
class Component extends DCLogic {
  renderVals() {
    const classic = (this.props.ticket ?? 'light') === 'classic';
    const s = classic ? {
      cardBg: "linear-gradient(115deg,#1a2f72 0%,#1a2f72 46%,#6b1a4e 54%,#6b1a4e 100%)",
      cardBorder: "rgba(253,230,138,0.45)", shadow: "0 8px 18px rgba(15,23,42,0.18)",
      rule: "rgba(253,230,138,0.45)", ruleStyle: "dashed", label: "#fde68a",
      halvesBg: "rgba(2,6,23,0.45)", divider: "rgba(253,230,138,0.20)", team: "#FFFFFF",
      muted: "#cbd5e1", win: "#6ee7b7", lose: "#e2e8f0", liveText: "#6ee7b7",
      awaySel: "rgba(253,230,138,0.15)", homeSel: "rgba(253,230,138,0.15)", awayIdle: "transparent", homeIdle: "transparent",
      boxOn: { border: "#fde68a", bg: "#fde68a", text: "#1a2f72", rotate: "rotate(-7deg)" },
      boxOff: { border: "rgba(253,230,138,0.45)", bg: "transparent", text: "transparent", rotate: "none" },
      wonBg: "rgba(16,185,129,0.15)", wonText: "#6ee7b7"
    } : {
      cardBg: "#FFFFFF", cardBorder: "rgba(26,47,114,0.16)", shadow: "0 1px 2px rgba(15,23,42,0.05), 0 6px 16px rgba(15,23,42,0.06)",
      rule: "rgba(26,47,114,0.10)", ruleStyle: "solid", label: "#1A2F72",
      halvesBg: "#FFFFFF", divider: "rgba(26,47,114,0.12)", team: "#0F172A",
      muted: "#5B6B82", win: "#047857", lose: "#334155", liveText: "#047857",
      awaySel: "#FEF3C7", homeSel: "#FEF3C7", awayIdle: "#F5F7FD", homeIdle: "#FDF5F9",
      boxOn: { border: "#1A2F72", bg: "#1A2F72", text: "#FFFFFF", rotate: "rotate(-7deg)" },
      boxOff: { border: "rgba(26,47,114,0.35)", bg: "#FFFFFF", text: "transparent", rotate: "none" },
      wonBg: "#ECFDF5", wonText: "#047857"
    };
    const raw = [
      { away: "Boston Celtics", home: "New York Knicks", status: "7:30 PM", pick: "home" },
      { away: "Los Angeles Lakers", home: "Golden State Warriors", status: "10:00 PM", pick: "away" },
      { away: "Miami Heat", home: "Orlando Magic", status: "Q3 · 5:12", live: true, awayScore: "78", homeScore: "81", pick: "" },
      { away: "Denver Nuggets", home: "Phoenix Suns", status: "Final", awayScore: "112", homeScore: "104", winner: "away", pick: "away", result: "✓ Correct pick · +10 points" },
      { away: "Dallas Mavericks", home: "Houston Rockets", status: "8:00 PM", pick: "" }
    ];
    const games = raw.map((g) => ({
      away: g.away, home: g.home, status: g.status,
      s: s,
      statusColor: g.live ? s.liveText : s.muted,
      liveDot: g.live ? (classic ? "#34d399" : "#10B981") : "transparent",
      liveDisplay: g.live ? "inline-block" : "none",
      awayBg: g.pick === "away" ? s.awaySel : s.awayIdle,
      homeBg: g.pick === "home" ? s.homeSel : s.homeIdle,
      awayBox: g.pick === "away" ? s.boxOn : s.boxOff,
      homeBox: g.pick === "home" ? s.boxOn : s.boxOff,
      awayScore: g.awayScore ?? "", homeScore: g.homeScore ?? "",
      awayScoreColor: g.winner === "away" ? s.win : s.lose,
      homeScoreColor: g.winner === "home" ? s.win : s.lose,
      hasResult: Boolean(g.result), result: g.result ?? "", resultBg: s.wonBg, resultText: s.wonText
    }));
    const sports = [
      { label: "NBA", icon: "🏀", on: true }, { label: "MLB", icon: "⚾" }, { label: "NHL", icon: "🏒" },
      { label: "Soccer", icon: "⚽" }, { label: "MMA", icon: "🥊" }, { label: "Tennis", icon: "🎾", off: true }
    ].map((sp) => ({
      label: sp.label, icon: sp.icon,
      bg: sp.on ? "#1A2F72" : "#FFFFFF",
      border: sp.on ? "#1A2F72" : "rgba(15,23,42,0.12)",
      opacity: sp.off ? "0.45" : "1"
    }));
    const segments = Array.from({ length: 10 }, (_, i) => ({ color: i < 3 ? "#1A2F72" : "#E2E6ED" }));
    return { games: games, sports: sports, segments: segments };
  }
}
</script>
</body>
</html>
